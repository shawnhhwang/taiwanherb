<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_14)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    枸
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 014</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_14)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      明目
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <path d="M 400 480 Q 402 360 395 250 T 405 150" stroke="#5C3838" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 400 370 Q 330 330 280 270" stroke="#5C3838" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M 400 290 Q 470 250 515 190" stroke="#5C3838" stroke-width="3.5" stroke-linecap="round" fill="none"/>

        <!-- 互生單葉與短柄 -->
        <g transform="translate(300, 280)">
          <path d="M 30 0 C 0 25 -30 20 -50 0 C -30 -20 0 -20 30 0 Z" fill="#913535" stroke="#4D1C1C" stroke-width="1.4"/>
          <path d="M 30 0 L -45 0" stroke="#D98282" stroke-width="1.2"/>
        </g>
        <g transform="translate(490, 200)">
          <path d="M -30 0 C 0 25 30 20 50 0 C 30 -20 0 -20 -30 0 Z" fill="#B54C4C" stroke="#4D1C1C" stroke-width="1.4"/>
          <path d="M -30 0 L 45 0" stroke="#D98282" stroke-width="1.2"/>
        </g>

        <!-- 垂吊的鮮紅或紫黑水亮漿果 -->
        <!-- 左果串 -->
        <g transform="translate(340, 310)">
          <path d="M 0 0 Q -10 25 -15 40" stroke="#5C3838" stroke-width="1.5" fill="none"/>
          <ellipse cx="-15" cy="46" rx="9" ry="12" fill="#E6A817" stroke="#4D1C1C" stroke-width="1.2"/>
          <ellipse cx="-17" cy="43" rx="2.5" ry="4" fill="#FFF" opacity="0.8"/>
        </g>
        <!-- 右果串 (雙果) -->
        <g transform="translate(440, 240)">
          <path d="M 0 0 Q 15 20 20 35 M 0 0 Q 30 15 35 30" stroke="#5C3838" stroke-width="1.5" fill="none"/>
          <ellipse cx="20" cy="42" rx="9.5" ry="13" fill="#E6A817" stroke="#4D1C1C" stroke-width="1.2"/>
          <ellipse cx="18" cy="38" rx="2.5" ry="4" fill="#FFF" opacity="0.8"/>
          <ellipse cx="37" cy="36" rx="8" ry="11" fill="#E6A817" stroke="#4D1C1C" stroke-width="1.2"/>
          <ellipse cx="35" cy="33" rx="2" ry="3.5" fill="#FFF" opacity="0.8"/>
        </g>
        <!-- 頂端星狀小花 (龍葵白花黃蕊) -->
        <g transform="translate(405, 140)">
          <polygon points="0,-18 5,-5 18,-5 8,4 12,16 0,8 -12,16 -8,4 -18,-5 -5,-5" fill="#FCFAF2" stroke="#4D1C1C" stroke-width="1"/>
          <circle cx="0" cy="0" r="5" fill="#E6A817"/>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_14)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      枸杞子
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#913535" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#4D1C1C">
      補虛藥 (補陰)
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Lycium barbarum L.</tspan>
      <tspan fill="#8C775A"> · 茄科 (Solanaceae) 枸杞屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：桃竹苗
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
