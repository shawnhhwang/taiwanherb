<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_37)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    茵
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 037</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_37)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      退黃
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <!-- 直立芳香主莖 -->
        <path d="M 400 480 Q 402 340 398 220 T 400 130" stroke="#355357" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 400 380 Q 320 350 260 300" stroke="#355357" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M 400 300 Q 480 270 540 210" stroke="#355357" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- 深裂羽狀艾葉 (正面濃綠、背面銀灰白毛) -->
        <g transform="translate(260, 300)">
          <path d="M 50 0 C 30 15 10 30 -10 35 C -5 20 -15 15 -35 15 C -20 0 -35 -15 -45 -10 C -30 -25 -10 -20 0 -35 C 10 -20 30 -15 50 0 Z" fill="#2B5E63" stroke="#183B3E" stroke-width="1.5"/>
          <path d="M 50 0 L -30 0" stroke="#72A8AF" stroke-width="1.2"/>
        </g>
        <g transform="translate(540, 210)">
          <path d="M -50 0 C -30 15 -10 30 10 35 C 5 20 15 15 35 15 C 20 0 35 -15 45 -10 C 30 -25 10 -20 0 -35 C -10 -20 -30 -15 -50 0 Z" fill="#417E85" stroke="#183B3E" stroke-width="1.5"/>
          <path d="M -50 0 L 30 0" stroke="#72A8AF" stroke-width="1.2"/>
        </g>
        <g transform="translate(370, 220) scale(0.8)">
          <path d="M 40 0 C 20 12 10 25 -10 28 C -5 15 -15 10 -28 10 C -15 0 -28 -10 -35 -8 C -25 -20 -10 -15 0 -28 C 10 -15 25 -10 40 0 Z" fill="#72A8AF" stroke="#183B3E" stroke-width="1.5"/>
        </g>

        <!-- 頂部密生圓錐花序小花頭 (淡黃綠色小圓頭) -->
        <g transform="translate(400, 130)" fill="#E0924A" stroke="#183B3E" stroke-width="0.8">
          <circle cx="0" cy="0" r="5"/>
          <circle cx="-10" cy="-10" r="4.5"/>
          <circle cx="10" cy="-10" r="4.5"/>
          <circle cx="-16" cy="-22" r="4"/>
          <circle cx="0" cy="-24" r="4.5"/>
          <circle cx="16" cy="-22" r="4"/>
          <circle cx="-8" cy="-35" r="3.5"/>
          <circle cx="8" cy="-35" r="3.5"/>
          <circle cx="0" cy="-45" r="3"/>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_37)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      茵陳蒿
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#2B5E63" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#183B3E">
      清熱利濕藥
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Artemisia capillaris Thunb.</tspan>
      <tspan fill="#8C775A"> · 菊科 (Asteraceae) 蒿屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：嘉南
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
