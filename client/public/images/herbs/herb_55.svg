<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_55" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_55)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    構
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 055</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_55)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      楮實
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <!-- 木質強勁主幹 -->
        <path d="M 400 480 Q 395 360 405 260 T 400 150" stroke="#523721" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M 400 340 Q 330 300 290 240" stroke="#523721" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 402 280 Q 470 240 510 180" stroke="#523721" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- 莖幹上的鳥不踏皮刺 (食茱萸/刺蔥特徵) -->
        <polygon points="397,420 385,416 397,412" fill="#3D2513"/>
        <polygon points="403,370 415,366 403,362" fill="#3D2513"/>
        <polygon points="397,320 385,316 397,312" fill="#3D2513"/>

        <!-- 左側奇數羽狀複葉 -->
        <g transform="translate(290, 240)">
          <!-- 小葉 5 枚 -->
          <ellipse cx="-20" cy="-10" rx="26" ry="12" transform="rotate(-20 -20 -10)" fill="#734D2E" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="20" cy="15" rx="26" ry="12" transform="rotate(20 20 15)" fill="#946740" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="-45" cy="-35" rx="24" ry="11" transform="rotate(-30 -45 -35)" fill="#734D2E" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="0" cy="-20" rx="24" ry="11" transform="rotate(10 0 -20)" fill="#946740" stroke="#3D2513" stroke-width="1.2"/>
          <!-- 頂生小葉 -->
          <ellipse cx="-70" cy="-60" rx="28" ry="13" transform="rotate(-40 -70 -60)" fill="#BF946D" stroke="#3D2513" stroke-width="1.2"/>
        </g>

        <!-- 右側羽狀複葉 -->
        <g transform="translate(510, 180)">
          <ellipse cx="-15" cy="15" rx="24" ry="11" transform="rotate(-15 -15 15)" fill="#946740" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="20" cy="-10" rx="24" ry="11" transform="rotate(20 20 -10)" fill="#734D2E" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="5" cy="-35" rx="22" ry="10" transform="rotate(-5 5 -35)" fill="#946740" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="40" cy="-25" rx="22" ry="10" transform="rotate(30 40 -25)" fill="#734D2E" stroke="#3D2513" stroke-width="1.2"/>
          <ellipse cx="60" cy="-60" rx="26" ry="12" transform="rotate(45 60 -60)" fill="#BF946D" stroke="#3D2513" stroke-width="1.2"/>
        </g>

        <!-- 頂部聚繖花序與小紅黑漿果 -->
        <g transform="translate(400, 150)">
          <path d="M 0 0 L -25 -30 M 0 0 L 0 -40 M 0 0 L 25 -30" stroke="#523721" stroke-width="2"/>
          <!-- 果實簇 -->
          <circle cx="-30" cy="-35" r="7" fill="#B84D35" stroke="#3D2513" stroke-width="1"/>
          <circle cx="-20" cy="-45" r="6" fill="#B84D35" stroke="#3D2513" stroke-width="1"/>
          <circle cx="0" cy="-48" r="7.5" fill="#B84D35" stroke="#3D2513" stroke-width="1"/>
          <circle cx="20" cy="-45" r="6" fill="#B84D35" stroke="#3D2513" stroke-width="1"/>
          <circle cx="30" cy="-35" r="7" fill="#B84D35" stroke="#3D2513" stroke-width="1"/>
          <!-- 高光點 -->
          <circle cx="-32" cy="-37" r="2" fill="#FFF" opacity="0.8"/>
          <circle cx="-2" cy="-50" r="2" fill="#FFF" opacity="0.8"/>
          <circle cx="28" cy="-37" r="2" fill="#FFF" opacity="0.8"/>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_55)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      構樹
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#734D2E" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3D2513">
      補虛藥 (補陰)
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Broussonetia papyrifera (L.) L'Hér. ex Vent.</tspan>
      <tspan fill="#8C775A"> · 桑科 (Moraceae) 構樹屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：全島平野與山林
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
