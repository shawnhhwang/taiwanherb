<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_39)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    落
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 039</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_39)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      倒吊
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <path d="M 400 480 Q 400 525 390 550 M 405 490 Q 425 530 430 550" stroke="#5C3838" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
        <!-- 肥厚肉質多汁主莖 -->
        <path d="M 400 480 Q 402 360 398 240 T 400 150" stroke="#5C3838" stroke-width="7" stroke-linecap="round" fill="none"/>

        <!-- 第一輪肉質圓卵形厚葉 (低) -->
        <g transform="translate(340, 420)">
          <path d="M 60 10 C 20 30 -30 20 -40 -10 C -30 -35 30 -35 60 10 Z" fill="#913535" stroke="#4D1C1C" stroke-width="2"/>
          <circle cx="-15" cy="-10" r="15" fill="#FFF" opacity="0.12"/>
        </g>
        <g transform="translate(460, 420)">
          <path d="M -60 10 C -20 30 30 20 40 -10 C 30 -35 -30 -35 -60 10 Z" fill="#B54C4C" stroke="#4D1C1C" stroke-width="2"/>
          <circle cx="15" cy="-10" r="15" fill="#FFF" opacity="0.12"/>
        </g>

        <!-- 第二輪帶圓齒葉 (中，緣生不定芽/落地生根特徵) -->
        <g transform="translate(330, 330)">
          <path d="M 70 0 C 30 35 -20 30 -45 0 C -20 -30 30 -35 70 0 Z" fill="#913535" stroke="#4D1C1C" stroke-width="2"/>
          <!-- 葉緣小不定芽 -->
          <circle cx="-35" cy="-12" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
          <circle cx="-45" cy="0" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
          <circle cx="-35" cy="12" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
        </g>
        <g transform="translate(470, 330)">
          <path d="M -70 0 C -30 35 20 30 45 0 C 20 -30 -30 -35 -70 0 Z" fill="#B54C4C" stroke="#4D1C1C" stroke-width="2"/>
          <circle cx="35" cy="-12" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
          <circle cx="45" cy="0" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
          <circle cx="35" cy="12" r="4.5" fill="#D98282" stroke="#4D1C1C" stroke-width="0.8"/>
        </g>

        <!-- 頂端花序 (鐘形下垂花朵/倒吊蓮) -->
        <g transform="translate(400, 160)">
          <path d="M 0 20 Q -30 0 -40 -20 M 0 20 Q 30 0 40 -20" stroke="#5C3838" stroke-width="2.5" fill="none"/>
          <!-- 左鐘花 -->
          <g transform="translate(-40, -20)">
            <path d="M -12 0 C -12 18 12 18 12 0 C 8 -10 -8 -10 -12 0 Z" fill="#E6A817" stroke="#4D1C1C" stroke-width="1.2"/>
            <path d="M -8 18 L -14 26 M 0 18 L 0 28 M 8 18 L 14 26" stroke="#FFF2D9" stroke-width="1.5"/>
          </g>
          <!-- 右鐘花 -->
          <g transform="translate(40, -20)">
            <path d="M -12 0 C -12 18 12 18 12 0 C 8 -10 -8 -10 -12 0 Z" fill="#E6A817" stroke="#4D1C1C" stroke-width="1.2"/>
            <path d="M -8 18 L -14 26 M 0 18 L 0 28 M 8 18 L 14 26" stroke="#FFF2D9" stroke-width="1.5"/>
          </g>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_39)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      落地生根
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#913535" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#4D1C1C">
      清熱解毒藥
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Bryophyllum pinnatum (Lam.) Oken</tspan>
      <tspan fill="#8C775A"> · 景天科 (Crassulaceae) 落地生根屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：南部
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
