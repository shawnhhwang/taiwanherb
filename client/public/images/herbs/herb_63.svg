<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_63" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_63" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_63" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_63)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    台
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 063</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_63)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      高潔
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <!-- 直立細長綠莖 -->
        <path d="M 400 480 L 400 240" stroke="#355357" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <!-- 密生線狀披針形狹長葉片 -->
        <g stroke="#183B3E" stroke-width="1.2">
          <path d="M 400 440 Q 310 425 240 400" stroke="#355357" stroke-width="3" fill="none"/>
          <path d="M 400 440 Q 490 425 560 400" stroke="#355357" stroke-width="3" fill="none"/>
          <path d="M 400 370 Q 320 355 260 330" stroke="#355357" stroke-width="3" fill="none"/>
          <path d="M 400 370 Q 480 355 540 330" stroke="#355357" stroke-width="3" fill="none"/>
          <path d="M 400 300 Q 330 285 280 260" stroke="#355357" stroke-width="2.5" fill="none"/>
          <path d="M 400 300 Q 470 285 520 260" stroke="#355357" stroke-width="2.5" fill="none"/>
        </g>

        <!-- 台灣原生高潔喇叭狀白百合 (具酒紅色背稜) -->
        <g transform="translate(400, 240) rotate(-20)">
          <!-- 花梗 -->
          <path d="M 0 0 Q -20 -30 -30 -60" stroke="#355357" stroke-width="3.5" fill="none"/>
          <!-- 喇叭花冠 (白花底 + 紫紅背筋) -->
          <g transform="translate(-30, -60)">
            <path d="M 0 0 C 10 -40 30 -70 60 -90 C 20 -80 -20 -80 -60 -90 C -30 -70 -10 -40 0 0 Z" fill="#FCFAF2" stroke="#183B3E" stroke-width="1.5"/>
            <!-- 花被背面酒紅紫條紋 (台灣百合特徵) -->
            <path d="M 0 0 C 5 -40 15 -70 30 -85" stroke="#E0924A" stroke-width="2.5" fill="none"/>
            <path d="M 0 0 C -5 -40 -15 -70 -30 -85" stroke="#E0924A" stroke-width="2.5" fill="none"/>
            <!-- 雄蕊花藥 -->
            <line x1="0" y1="-30" x2="10" y2="-80" stroke="#355357" stroke-width="1.2"/>
            <ellipse cx="10" cy="-80" rx="4" ry="7" fill="#E6A817"/>
          </g>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_63)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      台灣百合
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#2B5E63" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#183B3E">
      補虛藥 (補陰)
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Lilium formosanum Wallace</tspan>
      <tspan fill="#8C775A"> · 百合科 (Liliaceae) 百合屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：全島平野與山林
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
