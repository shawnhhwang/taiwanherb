<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_46" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_46" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_46" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_46)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    雞
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 046</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_46)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      豆沙
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <!-- 纏繞的主蔓 -->
        <path d="M 400 480 Q 420 400 380 340 T 410 240 T 390 140 T 420 60" stroke="#455A46" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <!-- 捲鬚 -->
        <path d="M 400 340 Q 450 330 465 315 Q 475 300 460 295 Q 445 300 455 310" stroke="#455A46" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M 390 200 Q 340 190 325 175 Q 315 160 330 155 Q 345 160 335 170" stroke="#455A46" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- 互生/對生藤葉 -->
        <g transform="translate(360, 390)">
          <path d="M 40 0 C 0 30 -40 25 -60 0 C -40 -25 0 -25 40 0 Z" fill="#2E5A44" stroke="#1C3829" stroke-width="1.5"/>
          <path d="M 40 0 L -50 0" stroke="#88B89C" stroke-width="1.2"/>
        </g>
        <g transform="translate(430, 310)">
          <path d="M -40 0 C 0 30 40 25 60 0 C 40 -25 0 -25 -40 0 Z" fill="#4D8067" stroke="#1C3829" stroke-width="1.5"/>
          <path d="M -40 0 L 50 0" stroke="#88B89C" stroke-width="1.2"/>
        </g>
        <g transform="translate(370, 230)">
          <path d="M 35 0 C 0 25 -35 20 -50 0 C -35 -20 0 -20 35 0 Z" fill="#2E5A44" stroke="#1C3829" stroke-width="1.5"/>
        </g>

        <!-- 金銀花成對雙花 / 或山苦瓜果實 (管狀唇形金銀雙花) -->
        <g transform="translate(410, 160)">
          <!-- 白花 (銀花) -->
          <g transform="rotate(-25)">
            <path d="M 0 0 C 15 -20 30 -50 45 -70 C 35 -75 25 -65 15 -45 Z" fill="#FCFAF2" stroke="#E6A15C" stroke-width="1.2"/>
            <path d="M 45 -70 Q 55 -85 50 -95 M 40 -70 Q 45 -85 40 -95" stroke="#E6A15C" stroke-width="1" fill="none"/>
          </g>
          <!-- 金花 (金花) -->
          <g transform="rotate(25)">
            <path d="M 0 0 C -15 -20 -30 -50 -45 -70 C -35 -75 -25 -65 -15 -45 Z" fill="#E6A15C" stroke="#1C3829" stroke-width="1.2"/>
            <path d="M -45 -70 Q -55 -85 -50 -95 M -40 -70 Q -45 -85 -40 -95" stroke="#FFF" stroke-width="1" fill="none"/>
          </g>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_46)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      雞屎藤
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#2E5A44" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1C3829">
      客家風土民俗草
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Paederia foetida L.</tspan>
      <tspan fill="#8C775A"> · 茜草科 (Rubiaceae) 雞矢藤屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：桃竹苗
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
