<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 古卷宣紙米色漸層背景 -->
    <linearGradient id="paperGrad_25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>

    <!-- 標本古典標籤漸層 -->
    <linearGradient id="cartoucheGrad_25" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9F6EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 朱紅印泥質感漸層 -->
    <linearGradient id="sealGrad_25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83828"/>
      <stop offset="100%" stop-color="#96281B"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景宣紙底圖 -->
  <rect width="800" height="600" fill="url(#paperGrad_25)"/>

  <!-- 2. 古典雙框細線條與四角回紋綴飾 -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C2B299" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#A89477" stroke-width="0.8"/>
  <!-- 四角折角飾花 -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 40 L 760 40 L 760 24" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>
  <path d="M 776 560 L 760 560 L 760 576" fill="none" stroke="#8C775A" stroke-width="1.8"/>

  <!-- 3. 背景巨幅水墨篆體文字水印 (淡雅半透明) -->
  <text x="400" y="380" font-family="'Noto Serif TC', 'Songti TC', 'STSong', serif" font-size="280" font-weight="900" text-anchor="middle" fill="#806D53" opacity="0.04" user-select="none">
    香
  </text>

  <!-- 4. 頂部植物誌卷標與標本編號 -->
  <g font-family="'Noto Serif TC', 'Songti TC', serif" fill="#756247">
    <text x="48" y="56" font-size="12" letter-spacing="2">臺灣本草植物標本圖譜 · 典藏正卷</text>
    <text x="48" y="74" font-size="10" font-family="monospace" letter-spacing="1" fill="#998366">HERBARIUM FORMOSA · SPECIMEN NO. 025</text>
  </g>

  <!-- 5. 東方朱紅印章 (右上印) -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#sealGrad_25)" stroke="#7D1E12" stroke-width="1.5"/>
    <rect x="3" y="3" width="36" height="36" rx="2" fill="none" stroke="#FCECE8" stroke-width="0.8" opacity="0.85"/>
    <text x="21" y="27" font-family="'Noto Serif TC', 'Songti TC', 'Kaiti TC', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF4F0" letter-spacing="2">
      芳香
    </text>
  </g>

  <!-- 6. 植物本體植物學線條與工筆水彩插圖 -->
  <g class="botanical-illustration">
    
        <!-- 叢生鬚根 -->
        <g stroke="#455A46" stroke-width="2" stroke-linecap="round" opacity="0.7">
          <path d="M 400 480 Q 380 520 370 550"/>
          <path d="M 400 480 Q 395 530 395 555"/>
          <path d="M 400 480 Q 410 530 415 555"/>
          <path d="M 400 480 Q 425 520 440 550"/>
        </g>

        <!-- 莖基鱗葉鞘 (厚實基部) -->
        <path d="M 375 480 Q 400 460 425 480 Z" fill="#455A46" stroke="#1C3829" stroke-width="1.5"/>

        <!-- 噴泉狀優雅長狹葉片 -->
        <!-- 左長葉 1 -->
        <path d="M 395 470 Q 300 400 240 280 Q 220 220 180 180 Q 220 230 260 310 Q 320 400 395 470 Z" fill="#2E5A44" stroke="#1C3829" stroke-width="1.2"/>
        <!-- 左長葉 2 -->
        <path d="M 398 470 Q 330 360 290 230 Q 280 160 260 110 Q 290 170 310 260 Q 350 370 398 470 Z" fill="#4D8067" stroke="#1C3829" stroke-width="1.2"/>
        <!-- 中央直挺葉與花序軸 -->
        <path d="M 400 470 Q 398 320 400 180 Q 401 110 400 60 Q 403 110 402 180 Q 402 320 400 470 Z" fill="#88B89C" stroke="#1C3829" stroke-width="1.2"/>
        <!-- 右長葉 1 -->
        <path d="M 402 470 Q 470 360 510 230 Q 520 160 540 110 Q 510 170 490 260 Q 450 370 402 470 Z" fill="#4D8067" stroke="#1C3829" stroke-width="1.2"/>
        <!-- 右長葉 2 -->
        <path d="M 405 470 Q 500 400 560 280 Q 580 220 620 180 Q 580 230 540 310 Q 480 400 405 470 Z" fill="#2E5A44" stroke="#1C3829" stroke-width="1.2"/>

        <!-- 頂生細柔圓錐花序小穗 -->
        <g transform="translate(400, 100)" stroke="#1C3829" stroke-width="0.8">
          <line x1="0" y1="40" x2="-25" y2="10" stroke="#455A46" stroke-width="1.5"/>
          <line x1="0" y1="40" x2="25" y2="10" stroke="#455A46" stroke-width="1.5"/>
          <line x1="0" y1="20" x2="-20" y2="-15" stroke="#455A46" stroke-width="1.5"/>
          <line x1="0" y1="20" x2="20" y2="-15" stroke="#455A46" stroke-width="1.5"/>
          <ellipse cx="-25" cy="10" rx="9" ry="3.5" transform="rotate(-30 -25 10)" fill="#E6A15C"/>
          <ellipse cx="25" cy="10" rx="9" ry="3.5" transform="rotate(30 25 10)" fill="#E6A15C"/>
          <ellipse cx="-20" cy="-15" rx="8" ry="3" transform="rotate(-40 -20 -15)" fill="#E6A15C"/>
          <ellipse cx="20" cy="-15" rx="8" ry="3" transform="rotate(40 20 -15)" fill="#E6A15C"/>
          <ellipse cx="0" cy="-40" rx="10" ry="4" transform="rotate(90 0 -40)" fill="#E6A15C"/>
        </g>
      
  </g>

  <!-- 7. 底部植物學古典名錄籤條 (Cartouche) -->
  <g transform="translate(48, 470)">
    <!-- 標籤背底框 -->
    <rect x="0" y="0" width="704" height="84" rx="6" fill="url(#cartoucheGrad_25)" stroke="#B8A58A" stroke-width="1.2"/>
    <rect x="4" y="4" width="696" height="76" rx="4" fill="none" stroke="#D1C3AD" stroke-width="0.8"/>

    <!-- 藥材大名 -->
    <text x="24" y="38" font-family="'Noto Serif TC', 'Songti TC', serif" font-size="28" font-weight="bold" fill="#2C241B" letter-spacing="3">
      香茅
    </text>

    <!-- 典藏分類標籤 -->
    <rect x="24" y="50" width="100" height="20" rx="3" fill="#2E5A44" opacity="0.15"/>
    <text x="74" y="64" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1C3829">
      客家風土民俗草
    </text>

    <!-- 科屬與學名 -->
    <text x="140" y="64" font-family="'Noto Serif TC', Georgia, serif" font-size="12" fill="#5E4E3A">
      <tspan font-style="italic" font-weight="600">Cymbopogon citratus (DC.) Stapf</tspan>
      <tspan fill="#8C775A"> · 禾本科 (Poaceae) 香茅屬</tspan>
    </text>

    <!-- 風土產地銘文 (右側) -->
    <text x="680" y="38" font-family="'Noto Serif TC', serif" font-size="12" text-anchor="end" fill="#6E5C47">
      道地產區：桃竹苗
    </text>
    <text x="680" y="60" font-family="'Noto Serif TC', serif" font-size="10.5" text-anchor="end" fill="#998366">
      國家植物標本館 · 數位原創無版權典藏
    </text>
  </g>
</svg>
