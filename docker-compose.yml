version: '3.8'

services:
  taiwanherb:
    build:
      context: .
      dockerfile: Dockerfile
    image: taiwanherb:latest
    container_name: taiwanherb-app
    restart: unless-stopped
    ports:
      - "9390:9390"
    environment:
      - PORT=9390
      - NODE_ENV=production
      - DB_FALLBACK_MEMORY=true
      - ADMIN_PASSWORD=taiwanherb2026
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./client/public/images/uploads:/app/client/public/images/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9390/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
